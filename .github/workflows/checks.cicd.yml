name: Markdown tooling checks
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node dist/mdcomposer.cli.cjs lint --root . --input README.md --input AGENTS.md --input docs --input skills
      - run: npm pack --dry-run
